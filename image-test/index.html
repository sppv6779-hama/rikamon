<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>りかモン 画像接続テスト</title>
<style>body{margin:0;background:#edf3fb;color:#17243c;font-family:system-ui,sans-serif}main{max-width:600px;margin:32px auto;padding:24px;background:white;border-radius:20px;box-shadow:0 10px 30px #17243c12}h1{font-size:24px;margin-top:0}.picture{background:repeating-conic-gradient(#edf1f6 0% 25%,#fff 0% 50%) 0/24px 24px;border-radius:16px;padding:20px;text-align:center}img{display:block;width:100%;max-width:420px;height:auto;margin:auto}#status{padding:16px;background:#fff3ce;border-radius:12px;font-weight:700}.ok{background:#dcfce7!important;color:#166534}.fail{background:#fee2e2!important;color:#991b1b}p{line-height:1.8}a{color:#2458ac}small{color:#66758b}@media(max-width:650px){main{margin:16px;padding:20px}}</style></head>
<body><main><h1>りかモン 画像接続テスト</h1><p>学校のネットワークに接続した生徒用PCで、このページを開いてください。</p><p id="status" role="status">画像を読み込んでいます…</p><div class="picture"><img id="monster" src="monster.webp" width="500" height="500" alt="岩タイプの幼年期モンスター"></div><p>モンスターが表示され、上に<strong>「画像表示OK」</strong>と出れば、この配信先の画像を読み込めています。</p><p><a href="monster.webp" target="_blank" rel="noopener">画像だけを開く</a> · <a href="index.html">再読み込み</a></p><small>画像はHTMLとは別のWebPファイルです。ログインは不要です。テスト版：2026-10-14</small></main>
<script>const img=document.getElementById('monster'),s=document.getElementById('status');function ok(){s.textContent='画像表示OK — モンスター画像を読み込めました';s.className='ok'}function fail(){s.textContent='画像を読み込めませんでした。フィルタリングや通信状態を確認してください。';s.className='fail'}img.addEventListener('load',ok);img.addEventListener('error',fail);if(img.complete){img.naturalWidth?ok():fail()}</script></body></html>
